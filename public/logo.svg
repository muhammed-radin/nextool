<?xml version="1.0" encoding="utf-8"?>
<!-- NexTool Q1 product logo — blue gradient tile + white circuit-trace "N".
     Matches the generated icon package (public/icons/icons-mupc8ncv/). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NexTool logo">
  <defs>
    <linearGradient id="nexool-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fc0f0"/>
      <stop offset="45%" stop-color="#1668c7"/>
      <stop offset="100%" stop-color="#101d7a"/>
    </linearGradient>
    <filter id="nexool-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- full-bleed gradient tile -->
  <rect width="512" height="512" fill="url(#nexool-bg)"/>

  <!-- circuit-trace N monogram -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#nexool-glow)">
    <path d="M148 396 V116"/>
    <path d="M148 116 L364 332 V396"/>
    <path d="M364 116 V232"/>
    <!-- inner parallel trace on the diagonal -->
    <path d="M206 340 V188 L316 298" stroke-width="18" opacity="0.9"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#ffffff" filter="url(#nexool-glow)">
    <circle cx="148" cy="116" r="24"/>
    <circle cx="364" cy="116" r="24"/>
    <circle cx="364" cy="232" r="16"/>
    <circle cx="148" cy="396" r="20"/>
    <circle cx="364" cy="396" r="20"/>
    <circle cx="206" cy="188" r="12"/>
    <circle cx="316" cy="298" r="12"/>
  </g>
</svg>
